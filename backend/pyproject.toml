[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["alembic"]

[tool.ruff.lint]
# B008: Depends() in argument defaults is FastAPI's dependency-injection idiom
ignore = ["B008"]